# The drydock: three seats on the fake harness, one in each kind of session, for the tests and the drill.
# It runs anywhere, needs no credential and spends nothing. For a crew on real programs, see ships/default.

[ship]
code = "checkout"
name = "drydock"
operator = "operator"            # what this ship calls its human

[pools.fake]
provider = "synthetic"                # the fake harness needs no credential

[sessions.bridge]
title = "Bridge"

[sessions.office]
title = "Office"
human = true                     # Into a session the human owns it types only when a message waits there, no watch is armed and the box is empty.

[sessions.crew]
title = "Crew"

[seats.captain]
session = "bridge"
role = "captain"
persona = "Picard"
harness = "fake"
pool = "fake"
model = "fake-1"
effort = "high"

[seats.desk]
session = "office"
role = "desk"
persona = "Maeve"
harness = "fake"
pool = "fake"
model = "fake-1"

[seats.worker-1]
session = "crew"
role = "worker"
harness = "fake"
pool = "fake"
model = "fake-1"
fresh = "after-order"            # a clean context for every order
