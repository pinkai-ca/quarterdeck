# Copy this complete ship, edit the pools/models for this machine, then qd up.
# These are example declarations, not discovered sign-ins or model availability.
[ship]
name = "forum"
operator = "operator"
workspace = "work"

[pools.claude]
provider = "anthropic"
config_dir = "~/.claude"

[pools.codex]
provider = "openai"
config_dir = "~/.codex"

[pools.grok]
provider = "xai"
config_dir = "~/.grok"

[pools.local]
provider = "local"
endpoint = "http://127.0.0.1:8000/v1"
context = 32768

[sessions.forum]
title = "Forum"

[groups.reviewers]
lead = "lead"
members = ["reviewer-1", "reviewer-2", "reviewer-3", "reviewer-4"]

[seats.lead]
session = "forum"
role = "lead"
harness = "claude"
pool = "claude"
model = "claude-opus-5-5"
effort = "high"

[seats.reviewer-1]
session = "forum"
role = "reviewer"
harness = "claude"
pool = "claude"
model = "claude-opus-5-5"
effort = "high"

[seats.reviewer-2]
session = "forum"
role = "reviewer"
harness = "codex"
pool = "codex"
model = "gpt-6-astra"
effort = "high"

[seats.reviewer-3]
session = "forum"
role = "reviewer"
harness = "grok"
pool = "grok"
model = "grok-4.7-build"
effort = "high"

[seats.reviewer-4]
session = "forum"
role = "reviewer"
harness = "pi"
pool = "local"
model = "local-model" # replace with the model actually served
