[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quarterdeck"
version = "0.1.0"
description = "Runs a crew of coding agents as visible terminal sessions under one human's command."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Tyler Dwyer" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[project.scripts]
qd = "quarterdeck:main"
qd-fakeharness = "quarterdeck.fakeharness:main"

[tool.setuptools.packages.find]
where = ["src"]

# The one resource declaration: individual source files, preserving their directories.
[tool.setuptools.data-files]
"share/quarterdeck/standing-orders" = ["standing-orders/laws.md"]
"share/quarterdeck/standing-orders/harnesses" = [
    "standing-orders/harnesses/antigravity.md",
    "standing-orders/harnesses/claude.md",
    "standing-orders/harnesses/codex.md",
    "standing-orders/harnesses/fake.md",
    "standing-orders/harnesses/grok.md",
    "standing-orders/harnesses/opencode.md",
    "standing-orders/harnesses/pi.md",
]
"share/quarterdeck/standing-orders/roles" = [
    "standing-orders/roles/captain.md",
    "standing-orders/roles/desk.md",
    "standing-orders/roles/engineering.md",
    "standing-orders/roles/hand.md",
    "standing-orders/roles/systems.md",
    "standing-orders/roles/worker.md",
]
"share/quarterdeck/ships/drydock" = ["ships/drydock/orders.md", "ships/drydock/ship.toml"]
"share/quarterdeck/ships/default" = ["ships/default/orders.md", "ships/default/ship.toml"]
"share/quarterdeck/ships/forum" = [
    "ships/forum/README.md", "ships/forum/orders.md", "ships/forum/ship.toml",
]
"share/quarterdeck/ships/forum/roles" = ["ships/forum/roles/lead.md", "ships/forum/roles/reviewer.md"]
"share/quarterdeck/ships/forum/work" = ["ships/forum/work/README.md"]
"share/quarterdeck/ships/cascade" = [
    "ships/cascade/README.md", "ships/cascade/orders.md", "ships/cascade/ship.toml",
]
"share/quarterdeck/ships/cascade/roles" = [
    "ships/cascade/roles/orchestrator.md", "ships/cascade/roles/ring.md",
]
"share/quarterdeck/ships/shuttle" = [
    "ships/shuttle/README.md", "ships/shuttle/mission-record.md",
    "ships/shuttle/orders.md", "ships/shuttle/ship.toml",
]
"share/quarterdeck/ships/shuttle/roles" = [
    "ships/shuttle/roles/captain.md", "ships/shuttle/roles/engineering.md",
    "ships/shuttle/roles/first-officer.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
tmp_path_retention_count = 3
tmp_path_retention_policy = "failed"
