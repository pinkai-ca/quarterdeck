[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quarterdeck"
version = "0.1.0"
description = "Runs a crew of coding agents as visible terminal sessions under one human's command."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Tyler Dwyer" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[project.scripts]
qd = "quarterdeck:main"
qd-fakeharness = "quarterdeck.fakeharness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
tmp_path_retention_count = 3
