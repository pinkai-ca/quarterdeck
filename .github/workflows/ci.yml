name: Tests and drill

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Rollback tests archive actual preceding commits.
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes git tmux bubblewrap python3-venv python3-setuptools python3-wheel
          # Only on this disposable runner, if Ubuntu blocks required namespaces.
          if ! bwrap --ro-bind / / true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / true
      - name: Create a fresh Python environment
        # Distro build tools also serve the upgrade test's separate installation.
        run: |
          git config --global user.name 'Quarterdeck CI'
          git config --global user.email 'ci@example.invalid'
          /usr/bin/python3 -c 'import sys; assert sys.version_info >= (3, 12)'
          /usr/bin/python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'
      - name: Unit, contract and integration tests
        run: |
          . .venv/bin/activate
          env -u QD_SHIP -u QD_SEAT python -m pytest -q -rs -n 8
      - name: Fake-harness drill
        run: |
          . .venv/bin/activate
          env -u QD_SHIP -u QD_SEAT qd drill
    # Local command proof does not prove the runner; inspect the first Actions run.
