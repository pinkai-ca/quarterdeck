name: Tests and drill

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The distro's Python, and the oldest version pyproject.toml claims.
        python: [system, "3.12"]
    env:
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Rollback tests archive actual preceding commits.
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes git tmux bubblewrap python3-venv python3-setuptools python3-wheel \
            python3-pytest python3-pytest-xdist
          # Only on this disposable runner, if Ubuntu blocks required namespaces.
          if ! bwrap --ro-bind / / true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / true
      - if: matrix.python != 'system'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Choose the interpreter
        # The upgrade test builds the ship's venv on the base interpreter's setuptools,
        # as python3-setuptools provides for the distro's Python.
        run: |
          if [ '${{ matrix.python }}' = system ]; then
            echo PYTHON=/usr/bin/python3 >> "$GITHUB_ENV"
            # Later steps find the distro's python3 first on PATH until a venv is activated.
            # The test step's .venv/bin still comes before it there: nested test-tool runs
            # get /usr/bin/python3 as their base because .venv was made from it.
            echo /usr/bin >> "$GITHUB_PATH"
          else
            python3 -c 'import sys; assert sys.version.startswith("${{ matrix.python }}."), sys.version'
            python3 -m pip install setuptools wheel pytest pytest-xdist
            echo "PYTHON=$(python3 -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          fi
      - name: Create a fresh Python environment
        # Distro build tools also serve the upgrade test's separate installation.
        run: |
          git config --global user.name 'Quarterdeck CI'
          git config --global user.email 'ci@example.invalid'
          "$PYTHON" -c 'import sys; assert sys.version_info >= (3, 12)'
          "$PYTHON" -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'
      - name: Unit, contract and integration tests
        run: |
          . .venv/bin/activate
          # Keep the existing socket-length guard independent of the checkout path.
          ci_socket_anchor="$(mktemp -d "${RUNNER_TEMP:?}/qs.XXXXXXXX")"
          exec {ci_socket_fd}<"$ci_socket_anchor"
          cleanup_ci_socket_anchor() {
            ci_test_status=$?
            trap - EXIT
            if ! { [ ! -L "$ci_socket_anchor" ] &&
                   ci_socket_current="$(stat -c '%d:%i' -- "$ci_socket_anchor")" &&
                   ci_socket_original="$(stat -Lc '%d:%i' -- "/proc/$$/fd/$ci_socket_fd")" &&
                   [ "$ci_socket_current" = "$ci_socket_original" ] &&
                   rmdir -- "$ci_socket_anchor"; }; then
              echo "Private CI socket anchor retained: $ci_socket_anchor" >&2
              if [ "$ci_test_status" -eq 0 ]; then ci_test_status=1; fi
            fi
            exit "$ci_test_status"
          }
          trap cleanup_ci_socket_anchor EXIT
          export TMUX_TMPDIR="$ci_socket_anchor"
          env -u QD_SHIP -u QD_SEAT python -m pytest -q -rs -n 8
      - name: Fake-harness drill
        run: |
          . .venv/bin/activate
          env -u QD_SHIP -u QD_SEAT qd drill
    # Local command proof does not prove the runner; inspect the first Actions run.
