[ship]
name = "enterprise"
operator = "Operator"                 # what this ship calls its human
workspace = "~/dev/quarterdeck"      # the default working directory of every seat

[pools.claude-primary]
provider = "anthropic"
config_dir = "~/.claude"

[pools.claude-secondary]
provider = "anthropic"
config_dir = "~/.config/claude-second"

[pools.codex]
provider = "openai"
home = "~/.codex"

[pools.google]
provider = "google"
config_dir = "~/.config/agy"

[pools.anthropic-api]
provider = "anthropic"
api_key = "keys:anthropic-api-key"     # the key is named, never written here
budget = "200 USD/month"             # optional: a wall when spent

[pools.local]
provider = "local"
endpoint = "http://127.0.0.1:8000/v1"  # a model served on this machine: no credential, no quota; a seat on it is jailed

[sessions.bridge]
title = "Ship's Bridge"

[sessions.office]
title = "Operator's Office"
human = true                         # Into a session the human owns it types only when a message waits there, no watch is armed and the box is empty.

[sessions.crew]
title = "Crew"

[seats.chair]
session = "bridge"
role = "captain"
persona = "Chair"
harness = "claude"
pool = "claude-secondary"
model = "claude-opus-5-5"
effort = "max"

[seats.maker]
session = "bridge"
role = "engineering"
persona = "Maker"
harness = "codex"
pool = "codex"
model = "gpt-6-astra"
effort = "xhigh"

[seats.desk]
session = "office"
role = "desk"
persona = "Clerk"
harness = "claude"
pool = ["claude-secondary", "claude-primary"]   # starts on the first; moves on at a wall and stays
model = "claude-opus-5-5"
effort = "max"
cwd = "~/dev"                        # a seat may override the workspace
remote_control = true

[seats.worker-1]
session = "crew"
role = "worker"
harness = "codex"
pool = "codex"
model = "gpt-6-astra"
effort = "high"
up = false                           # declared, brought up on demand
fresh = "after-order"                # a clean context for every order

[seats.worker-1.settings]            # the program's own keys, passed verbatim at launch
model_auto_compact_token_limit = 200000

[seats.worker-2]
session = "crew"
role = "worker"
harness = "opencode"
pool = "local"
model = "qwen3.8-27b"
up = false
sandbox = true                       # what a seat on an endpoint pool gets anyway; written to say so, or false to lift it
